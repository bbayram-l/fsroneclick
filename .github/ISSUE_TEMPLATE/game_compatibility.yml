name: Game compatibility report
description: Tell us how a specific game works with FSRoneclick (good or bad).
labels: [compatibility]
body:
  - type: input
    id: game
    attributes:
      label: Game and store
      placeholder: "Black Myth: Wukong (Steam)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU and driver
      placeholder: Radeon RX 7900 XTX, Adrenalin 26.6.2
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works
        - Works with tweaks
        - Broken
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Which options you enabled, the proxy hook used (dxgi.dll / winmm.dll / ...), in-game settings, and any tweaks needed.
    validations:
      required: true
