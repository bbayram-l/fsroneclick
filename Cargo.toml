[package]
name = "fsroneclick"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["FSRoneclick Contributors"]
description = "One-click deployment of AMD FSR (3.1 / 4.1.1 Redstone + Frame Generation), OptiScaler, ReShade, RenoDX HDR, and Anti-Lag 2 for AMD Radeon & Universal GPUs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bbayram-l/fsroneclick"
keywords = ["fsr", "fsr4", "amd", "frame-generation", "optiscaler"]
categories = ["command-line-utilities", "game-development", "gui"]

[dependencies]
eframe = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
regex = "1.10"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
